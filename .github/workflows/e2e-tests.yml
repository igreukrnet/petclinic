name: E2E Tests & Report

on:
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      publish_report:
        description: 'Publish Allure Report to AWS S3 & CloudFront'
        required: true
        type: boolean
        default: true
  
  # Nightly run - catches environment regressions even if code hasn't changed
  schedule:
    - cron: "0 2 * * *"
  
  # Optional: uncomment to run on every push (warning: slow, may want to keep manual only)
  # push:
  #   branches: [ main, master ]

# A new run waits for the running one instead of cancelling it: a cancelled run could stop in the
# middle of "aws s3 sync --delete" and leave a half-published report.
concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  MAVEN_OPTS: "-Xmx2048m -XX:+UseG1GC -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss:SSS"

jobs:
  e2e-tests:
    name: Execute E2E Tests & Generate Reports
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Free Disk Space (Ubuntu Runner)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and install internal test-framework modules
        run: |
          mvn -B install -DskipTests -f test-framework/pom.xml

      - name: Build application JARs
        run: |
          cd app
          mvn -B clean package -DskipTests spring-boot:repackage

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test-framework/pom.xml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers & Dependencies
        run: |
          mvn -B exec:java -pl e2e-tests -e \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium" \
            -f test-framework/pom.xml

      - name: Start PetClinic Microservices & MySQL (for E2E)
        run: |
          # visits-service can crash on its first start: its schema refers to the pets table that
          # customers-service creates. So a failed first "up" is not final; the readiness loop below decides.
          docker compose -f docker-compose.test.yml up -d --wait || true
          docker compose -f docker-compose.test.yml up -d visits-service

          echo "Waiting until every service is registered in Eureka and reachable through the gateway..."
          ready=0
          for i in {1..60}; do
            CUST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/customer/owners || true)
            VET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/vet/vets || true)
            VISIT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/visit/owners/1/pets/1/visits || true)
            # Owner 6 has seeded visits. They show up in the aggregate only when the gateway can reach
            # visits-service; before that the gateway answers 200 with empty visit lists.
            AGG_VISITS=$(curl -s http://localhost:8080/api/gateway/owners/6 | grep -o '"description"' | wc -l || true)

            echo "Readiness probe ($i/60): customers=$CUST_STATUS, vets=$VET_STATUS, visits=$VISIT_STATUS, visits in aggregate=$AGG_VISITS"
            if [ "$CUST_STATUS" = "200" ] && [ "$VET_STATUS" = "200" ] && [ "$VISIT_STATUS" = "200" ] && [ "$AGG_VISITS" -gt 0 ]; then
              ready=1
              break
            fi
            sleep 4
          done
          docker compose -f docker-compose.test.yml ps
          if [ "$ready" != "1" ]; then
            echo "::error::The stack did not become ready in time. The tests are not started; see the container logs artifact."
            exit 1
          fi

      # Must be green. Tests for known application defects are excluded here and run in the next step,
      # so a red result of this step always means a new problem.
      - name: Run E2E Tests
        run: |
          mvn -B test -pl e2e-tests -f test-framework/pom.xml "-Dgroups=!known-defect"

      # Informational. These tests fail on purpose until the application is fixed (see the issues in
      # their names). The step never fails the run; the outcome is written to the job summary.
      - name: Run Known-Defect Tests (informational)
        if: success() || failure()
        continue-on-error: true
        run: |
          set +e
          mvn -B test -pl e2e-tests -f test-framework/pom.xml -Dgroups=known-defect | tee known-defects.log
          status=${PIPESTATUS[0]}
          {
            echo "### Known application defects"
            echo ""
            echo "These tests fail on purpose until the application is fixed. They do not affect the result of this run."
            echo "A test that passes here means its defect is fixed: remove the \`known-defect\` tag from it."
            echo ""
            echo '```'
            grep -E "Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$|\[ERROR\]   [A-Za-z]" known-defects.log | sed -E 's/^.*\[(ERROR|INFO|WARNING)\] +//' | sort -u
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Collect Container Logs
        if: failure()
        run: |
          mkdir -p container-logs
          docker compose -f docker-compose.test.yml ps -a > container-logs/ps.txt 2>&1 || true
          for service in $(docker compose -f docker-compose.test.yml config --services); do
            docker compose -f docker-compose.test.yml logs --no-color "$service" > "container-logs/$service.log" 2>&1 || true
          done

      - name: Upload Container Logs Artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-logs
          path: container-logs
          retention-days: 14

      - name: Restore Allure History from AWS S3
        if: always() && env.CAN_ACCESS_AWS == 'true'
        env:
          CAN_ACCESS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && vars.S3_BUCKET_NAME != '' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
        run: |
          # The AWS CLI reads the key pair and the region from the environment of this step.
          
          mkdir -p test-framework/target/allure-results/history
          echo "Restoring previous Allure history from s3://${S3_BUCKET}/latest/history/..."
          aws s3 cp "s3://${S3_BUCKET}/latest/history" test-framework/target/allure-results/history --recursive || true

      - name: Generate Allure Report
        if: always()
        run: |
          mvn -B allure:report -f test-framework/pom.xml

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allure-results
          path: test-framework/target/allure-results
          retention-days: 14

      - name: Upload Allure HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allure-report
          path: test-framework/target/site/allure-maven-plugin
          retention-days: 30

      - name: Publish Allure Report to AWS S3 & CloudFront
        # Every run publishes (scheduled runs always; manual runs when publish_report is true).
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.publish_report == true) && env.CAN_PUBLISH == 'true'
        env:
          CAN_PUBLISH: ${{ secrets.AWS_ACCESS_KEY_ID != '' && vars.S3_BUCKET_NAME != '' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
          CLOUDFRONT_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
        run: |
          # The AWS CLI reads the key pair and the region from the environment of this step.
          
          REPORT_DIR="test-framework/target/site/allure-maven-plugin"
          
          if [ -d "$REPORT_DIR" ]; then
            echo "Deploying Allure report to s3://${S3_BUCKET}/latest/..."
            # no-cache makes browsers revalidate the report, so an old copy is never shown.
            aws s3 sync "$REPORT_DIR" "s3://${S3_BUCKET}/latest/" --delete --cache-control "no-cache"

            BUILD_PATH="s3://${S3_BUCKET}/builds/${RUN_NUMBER}/"
            echo "Archiving report build to $BUILD_PATH..."
            aws s3 sync "$REPORT_DIR" "$BUILD_PATH" --cache-control "no-cache"
            
            if [ -n "$CLOUDFRONT_ID" ]; then
              echo "Invalidating CloudFront cache..."
              aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "/*"
            fi

            # The bucket is private: reports are only reachable through CloudFront, never the S3 URL.
            # The domain comes from the CLOUDFRONT_DOMAIN variable; it is read from AWS only as a fallback.
            CF_DOMAIN="${CLOUDFRONT_DOMAIN:-}"
            if [ -z "$CF_DOMAIN" ] && [ -n "$CLOUDFRONT_ID" ]; then
              CF_DOMAIN=$(aws cloudfront get-distribution --id "$CLOUDFRONT_ID" --query "Distribution.DomainName" --output text 2>/dev/null || echo "")
            fi
            if [ -z "$CF_DOMAIN" ]; then
              echo "::warning::CLOUDFRONT_DOMAIN is not set; report links in the summary will be empty."
            fi
            REPORT_URL="https://${CF_DOMAIN}/latest/index.html"
            # Permanent link to this run's archived report (latest is overwritten by every run).
            BUILD_URL="https://${CF_DOMAIN}/builds/${RUN_NUMBER}/index.html"

            echo "### 📊 Allure Test Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚀 **Report for this run:** [$BUILD_URL]($BUILD_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Latest run: [$REPORT_URL]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| **S3 Bucket** | \`${S3_BUCKET}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **CloudFront ID** | \`${CLOUDFRONT_ID}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Build Number** | \`#${RUN_NUMBER}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Trigger** | \`${EVENT_NAME}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Ref / Branch** | \`${REF_NAME}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Timestamp** | \`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Warning: Allure report directory not found, skipping S3 upload."
          fi

      - name: Stop Containers
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
