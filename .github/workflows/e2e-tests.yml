name: E2E Tests & Report

on:
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      publish_report:
        description: 'Publish Allure Report to AWS S3 & CloudFront'
        required: true
        type: boolean
        default: true
  
  # Nightly run - catches environment regressions even if code hasn't changed
  schedule:
    - cron: "0 2 * * *"
  
  # Optional: uncomment to run on every push (warning: slow, may want to keep manual only)
  # push:
  #   branches: [ main, master ]

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  MAVEN_OPTS: "-Xmx2048m -XX:+UseG1GC -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss:SSS"

jobs:
  e2e-tests:
    name: Execute E2E Tests & Generate Reports
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Free Disk Space (Ubuntu Runner)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and install internal test-framework modules
        run: |
          mvn -B install -DskipTests -f test-framework/pom.xml

      - name: Build application JARs
        run: |
          cd app
          mvn -B clean package -DskipTests spring-boot:repackage

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test-framework/pom.xml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers & Dependencies
        run: |
          mvn -B exec:java -pl e2e-tests -e \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium" \
            -f test-framework/pom.xml

      - name: Start PetClinic Microservices & MySQL (for E2E)
        run: |
          docker compose -f docker-compose.test.yml up -d --wait
          echo "Waiting for all microservices to be registered in Eureka and routable via API Gateway..."
          for i in {1..60}; do
            CUST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/customer/owners || true)
            VET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/vet/vets || true)
            VISIT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/visit/owners/1/pets/1/visits || true)
            
            echo "Readiness probe ($i/60): customers=$CUST_STATUS, vets=$VET_STATUS, visits=$VISIT_STATUS"
            if [ "$CUST_STATUS" = "200" ] && [ "$VET_STATUS" = "200" ] && [ "$VISIT_STATUS" = "200" ]; then
              echo "All microservices are fully registered in Eureka and returning HTTP 200 via API Gateway!"
              break
            fi
            sleep 4
          done
          docker compose -f docker-compose.test.yml ps

      - name: Run E2E Tests
        run: |
          mvn -B test -pl e2e-tests -f test-framework/pom.xml

      - name: Restore Allure History from AWS S3
        if: always() && env.CAN_ACCESS_AWS == 'true'
        env:
          CAN_ACCESS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && vars.S3_BUCKET_NAME != '' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set default.region "$AWS_REGION"
          
          mkdir -p target/allure-results/history
          mkdir -p test-framework/target/allure-results/history
          echo "Restoring previous Allure history from s3://${S3_BUCKET}/latest/history/..."
          aws s3 cp "s3://${S3_BUCKET}/latest/history" target/allure-results/history --recursive || true
          aws s3 cp "s3://${S3_BUCKET}/latest/history" test-framework/target/allure-results/history --recursive || true

      - name: Generate Allure Report
        if: always()
        run: |
          mvn -B allure:report -f test-framework/pom.xml

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            target/allure-results
            test-framework/target/allure-results
          retention-days: 14

      - name: Upload Allure HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            target/site/allure-maven-plugin
            test-framework/target/site/allure-maven-plugin
          retention-days: 30

      - name: Publish Allure Report to AWS S3 & CloudFront
        # Every run publishes (scheduled runs always; manual runs when publish_report is true).
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.publish_report == true) && env.CAN_PUBLISH == 'true'
        env:
          CAN_PUBLISH: ${{ secrets.AWS_ACCESS_KEY_ID != '' && vars.S3_BUCKET_NAME != '' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
          CLOUDFRONT_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set default.region "$AWS_REGION"
          
          REPORT_DIR="target/site/allure-maven-plugin"
          if [ ! -d "$REPORT_DIR" ]; then
            REPORT_DIR="test-framework/target/site/allure-maven-plugin"
          fi
          
          if [ -d "$REPORT_DIR" ]; then
            echo "Deploying Allure report to s3://${S3_BUCKET}/latest/..."
            aws s3 sync "$REPORT_DIR" "s3://${S3_BUCKET}/latest/" --delete
            
            BUILD_PATH="s3://${S3_BUCKET}/builds/${{ github.run_number }}/"
            echo "Archiving report build to $BUILD_PATH..."
            aws s3 sync "$REPORT_DIR" "$BUILD_PATH"
            
            if [ -n "$CLOUDFRONT_ID" ]; then
              echo "Invalidating CloudFront cache..."
              aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "/*"
            fi

            # The bucket is private: reports are only reachable through CloudFront, never the S3 URL.
            # The domain comes from the CLOUDFRONT_DOMAIN variable; it is read from AWS only as a fallback.
            CF_DOMAIN="${CLOUDFRONT_DOMAIN:-}"
            if [ -z "$CF_DOMAIN" ] && [ -n "$CLOUDFRONT_ID" ]; then
              CF_DOMAIN=$(aws cloudfront get-distribution --id "$CLOUDFRONT_ID" --query "Distribution.DomainName" --output text 2>/dev/null || echo "")
            fi
            if [ -z "$CF_DOMAIN" ]; then
              echo "::warning::CLOUDFRONT_DOMAIN is not set; report links in the summary will be empty."
            fi
            REPORT_URL="https://${CF_DOMAIN}/latest/index.html"
            # Permanent link to this run's archived report (latest is overwritten by every run).
            BUILD_URL="https://${CF_DOMAIN}/builds/${{ github.run_number }}/index.html"

            echo "### 📊 Allure Test Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚀 **Report for this run:** [$BUILD_URL]($BUILD_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Latest run: [$REPORT_URL]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| **S3 Bucket** | \`${S3_BUCKET}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **CloudFront ID** | \`${CLOUDFRONT_ID}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Build Number** | \`#${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Ref / Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Timestamp** | \`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Warning: Allure report directory not found, skipping S3 upload."
          fi

      - name: Stop Containers
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
