name: Terraform Deploy

# Manual deployment of infrastructure changes. 
# Always review the plan before applying! 
# Requires AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets configured.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        type: choice
        default: "plan"
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

env:
  TF_ROOT: terraform
  TF_VERSION: 1.5.0

jobs:
  terraform-plan-apply:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: eu-north-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform Init
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -backend=false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform plan -out=tfplan -no-color
          terraform show -json tfplan > plan.json

      - name: Upload Terraform Plan Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan
          path: ${{ env.TF_ROOT }}/plan.json
          retention-days: 7

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('${{ env.TF_ROOT }}/plan.json', 'utf8'));
            
            let comment = '## 📋 Terraform Plan\n\n';
            
            if (plan.resource_changes && plan.resource_changes.length > 0) {
              comment += '### Changes:\n';
              plan.resource_changes.forEach(change => {
                const action = change.change.actions[0];
                const icon = action === 'create' ? '➕' : action === 'delete' ? '❌' : '🔄';
                comment += `- ${icon} \`${change.type}.${change.name}\` (${action})\n`;
              });
            } else {
              comment += '✅ No infrastructure changes detected.\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Terraform Apply
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_ROOT }}
        run: terraform apply tfplan

      - name: Output Values
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_ROOT }}
        run: |
          echo "## Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          terraform output -no-color >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** If you see sensitive values redacted above, check the full Terraform output in the job logs." >> $GITHUB_STEP_SUMMARY

      - name: Summary
        if: always()
        run: |
          echo "### Terraform ${{ inputs.action }} Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.action }}" = "plan" ]; then
            echo "Review the plan above and use **Terraform Deploy** workflow with **apply** action to apply changes." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Infrastructure has been updated." >> $GITHUB_STEP_SUMMARY
          fi
