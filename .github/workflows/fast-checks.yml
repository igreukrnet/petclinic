name: Fast Checks

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_OPTS: "-Xmx2048m -XX:+UseG1GC -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss:SSS"

jobs:
  build-and-component-tests:
    name: Build & Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and install internal test-framework modules
        run: |
          mvn -B install -DskipTests -f test-framework/pom.xml

      - name: Build application JARs
        run: |
          cd app
          mvn -B clean package -DskipTests spring-boot:repackage

      # Tests tagged known-defect fail on purpose until the application is fixed; they are excluded here
      # so that this check catches regressions. The same tests stay red in local runs.
      - name: Run Component Tests
        run: |
          mvn -B test -pl component-tests -f test-framework/pom.xml "-Dgroups=!known-defect"

      - name: Run Unit Tests of core and ai-triage
        run: |
          mvn -B test -pl core,ai-triage -f test-framework/pom.xml

      - name: Generate Allure Report
        if: always()
        run: |
          mvn -B allure:report -f test-framework/pom.xml

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-allure-results
          path: test-framework/target/allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-allure-report
          path: test-framework/target/site/allure-maven-plugin
          if-no-files-found: warn
          retention-days: 14
