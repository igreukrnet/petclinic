name: PetClinic Test Framework CI/CD

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run Automated Tests & Generate Allure Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start PetClinic Microservices & MySQL
        run: |
          docker compose -f docker-compose.test.yml up -d --wait
          docker compose -f docker-compose.test.yml ps

      - name: Install Playwright Browsers
        run: |
          mvn -B compile -f test-framework/pom.xml
          mvn -B exec:java -e \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium" \
            -f test-framework/pom.xml

      - name: Run Component & E2E Tests
        run: |
          mvn -B clean test -f test-framework/pom.xml

      - name: Generate Allure Report
        if: always()
        run: |
          mvn -B allure:report -f test-framework/pom.xml

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

      - name: Upload Allure HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            target/site/allure-maven-plugin
            test-framework/target/site/allure-maven-plugin
          retention-days: 30

      - name: Publish Allure Report to AWS S3 & CloudFront
        if: always() && env.HAVE_AWS_SECRETS == 'true'
        env:
          HAVE_AWS_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          S3_BUCKET: ${{ secrets.ALLURE_S3_BUCKET }}
          CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set default.region "$AWS_REGION"
          
          REPORT_DIR="target/site/allure-maven-plugin"
          if [ ! -d "$REPORT_DIR" ]; then
            REPORT_DIR="test-framework/target/site/allure-maven-plugin"
          fi
          
          if [ -d "$REPORT_DIR" ] && [ -n "$S3_BUCKET" ]; then
            echo "Deploying Allure report to s3://$S3_BUCKET/latest/..."
            aws s3 sync "$REPORT_DIR" "s3://$S3_BUCKET/latest/" --delete
            
            BUILD_PATH="s3://$S3_BUCKET/builds/${{ github.run_number }}/"
            echo "Archiving report build to $BUILD_PATH..."
            aws s3 sync "$REPORT_DIR" "$BUILD_PATH"
            
            if [ -n "$CLOUDFRONT_ID" ]; then
              echo "Invalidating CloudFront cache..."
              aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "/*"
            fi
          fi

      - name: Stop Containers
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
