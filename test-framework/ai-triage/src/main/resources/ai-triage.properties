# AI failure triage is off by default. To use it, turn it on and give the endpoint, the key and the model,
# as system properties (-Dai.triage.enabled=true -Dai.base.url=... -Dai.api.key=... -Dai.model=...)
# or as environment variables. Do not commit a key to this file.
ai.triage.enabled=false
ai.triage.max.calls=5
