# The pre-built springcommunity images are pinned by tag and digest, so every run uses the same bytes.
# 3.4.1 is the newest published version of these images; customers-service and api-gateway are built
# from app/ (4.0.1). To update: change the tag and take the new digest from Docker Hub.
services:
  mysql:
    image: mysql:8.4.5
    container_name: petclinic-mysql-test
    environment:
      - MYSQL_ROOT_PASSWORD=petclinic
      - MYSQL_DATABASE=petclinic
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppetclinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  config-server:
    image: springcommunity/spring-petclinic-config-server:3.4.1@sha256:db14626a92afda51963a29804fe24329b7711467ffdc7dc2157fe800abc3f756
    container_name: config-server-test
    environment:
      - JAVA_OPTS=-Xmx384m -Xms256m
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-I", "http://config-server:8888"]
      interval: 5s
      timeout: 5s
      retries: 10

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server:3.4.1@sha256:c3cb50137cf7f2f61ac7f3f878f93b79a3b71213360a0d4550a4f5ab4418c342
    container_name: discovery-server-test
    environment:
      - JAVA_OPTS=-Xmx384m -Xms256m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761"]
      interval: 5s
      timeout: 3s
      retries: 10

  customers-service:
    build:
      context: ./app
      dockerfile: ./docker/Dockerfile
      args:
        - ARTIFACT_NAME=spring-petclinic-customers-service/target/spring-petclinic-customers-service-4.0.1
        - EXPOSED_PORT=8081
    container_name: customers-service-test
    environment:
      - SPRING_PROFILES_ACTIVE=docker,mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic?allowPublicKeyRetrieval=true&useSSL=false
      - JAVA_OPTS=-Xmx384m -Xms256m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8081:8081"

  visits-service:
    image: springcommunity/spring-petclinic-visits-service:3.4.1@sha256:307ae223b722d13b7a0e35ef34e93352ab118687d9a0e189565392244031a1c7
    container_name: visits-service-test
    environment:
      - SPRING_PROFILES_ACTIVE=docker,mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic?allowPublicKeyRetrieval=true&useSSL=false
      - JAVA_OPTS=-Xmx384m -Xms256m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      customers-service:
        condition: service_started
    ports:
      - "8082:8082"

  vets-service:
    image: springcommunity/spring-petclinic-vets-service:3.4.1@sha256:963f480587e365b7ef17fdbcce5267ac3aa3436f649852cc7eb4f85da86abab4
    container_name: vets-service-test
    environment:
      - SPRING_PROFILES_ACTIVE=docker,mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic?allowPublicKeyRetrieval=true&useSSL=false
      - JAVA_OPTS=-Xmx384m -Xms256m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8083:8083"

  api-gateway:
    build:
      context: ./app
      dockerfile: ./docker/Dockerfile
      args:
        - ARTIFACT_NAME=spring-petclinic-api-gateway/target/spring-petclinic-api-gateway-4.0.1
        - EXPOSED_PORT=8080
    container_name: api-gateway-test
    environment:
      - JAVA_OPTS=-Xmx384m -Xms256m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      customers-service:
        condition: service_started
      visits-service:
        condition: service_started
      vets-service:
        condition: service_started
    ports:
      - "8080:8080"
