services:
  mysql:
    image: mysql:8.4.5
    container_name: petclinic-mysql-test
    environment:
      - MYSQL_ROOT_PASSWORD=petclinic
      - MYSQL_DATABASE=petclinic
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppetclinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  config-server:
    image: springcommunity/spring-petclinic-config-server
    container_name: config-server-test
    environment:
      - JAVA_OPTS=-Xmx384m -Xms256m
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-I", "http://config-server:8888"]
      interval: 5s
      timeout: 5s
      retries: 10

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    container_name: discovery-server-test
    environment:
      - JAVA_OPTS=-Xmx384m -Xms256m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761"]
      interval: 5s
      timeout: 3s
      retries: 10

  customers-service:
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service-test
    environment:
      - SPRING_PROFILES_ACTIVE=docker,mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic?allowPublicKeyRetrieval=true&useSSL=false
      - JAVA_OPTS=-Xmx384m -Xms256m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8081:8081"

  visits-service:
    image: springcommunity/spring-petclinic-visits-service
    container_name: visits-service-test
    environment:
      - SPRING_PROFILES_ACTIVE=docker,mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic?allowPublicKeyRetrieval=true&useSSL=false
      - JAVA_OPTS=-Xmx384m -Xms256m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      customers-service:
        condition: service_started
    ports:
      - "8082:8082"

  vets-service:
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service-test
    environment:
      - SPRING_PROFILES_ACTIVE=docker,mysql
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/petclinic?allowPublicKeyRetrieval=true&useSSL=false
      - JAVA_OPTS=-Xmx384m -Xms256m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8083:8083"

  api-gateway:
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway-test
    environment:
      - JAVA_OPTS=-Xmx384m -Xms256m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8080:8080"
